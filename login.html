<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン | Trophy App</title>
    <link rel="stylesheet" href="all.css">
    <script src="all.js" defer></script>
</head>
<body>
    <main class="login">
        <div class="login-header">
            <img src="image/icon.webp" class="login-logo">
            <h1 class="login-title">Myトロフィー</h1>
            <p class="login-subtitle">あなただけのトロフィーを集めよう</p>
            <p class="login-subtext">模擬アプリのためメールアドレスの入力は不要です<br>
                                    データはブラウザごとに保存されます</p>
        </div>
        <div class="login-container">
            <form class="login-form">
                <div class="form-group">
                    <label for="email">メールアドレス</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder=""
                        required>
                </div>
                <div class="form-group">
                    <label for="password">パスワード</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder=""
                        required>
                    <a href="#" class="login-link">パスワードを忘れた方</a>
                </div>
                <button type="submit" class="login-button" id="login-button">
                    ログイン
                </button>
            </form>
            <hr class="login-line">
            <a href="sigunup.html" class="login-link">新規アカウントを作成</a>
        </div>
    </main>
</body>
</html>
