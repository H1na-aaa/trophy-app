<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>カテゴリー | Trophy App</title>
    <link rel="stylesheet" href="all.css">
    <script src="all.js" defer></script>
</head>
<body>
    <!-- ヘッダー -->
    <header class="app-header">
        <button
            type="button"
            class="header-back"
            id="category-back-button">
            <img
                src="image/icon/back.webp"
                alt="戻る"
                class="header-img">
        </button>
        <h1
            class="header-title"
            id="category-page-title">
            カテゴリー
        </h1>
        <div class="header-right">
            <button
                type="button"
                class="header-search">
                <img
                    src="image/icon/search.webp"
                    alt="検索"
                    class="header-img">
            </button>
            <button
                type="button"
                class="header-setting">
                <img
                    src="image/icon/settings.webp"
                    alt="設定"
                    class="header-img">
            </button>
        </div>
    </header>
    <!-- トロフィー一覧 -->
<main class="category-trophy-list">

    <section
        class="category-page-summary"
        id="category-page-summary"
    >

        <button
            type="button"
            class="category-setting category-page-setting"
            id="category-page-setting"
            aria-label="カテゴリー設定"
        >
            <img
                class="setting-icon"
                src="image/icon/settings.webp"
                alt=""
            >
        </button>

        <img
            class="popup-trophy-image"
            id="category-summary-image"
            src="image/icon/default.webp"
            alt=""
        >

        <p class="popup-progress">
            <span id="category-summary-current">0</span>
            /
            <span id="category-summary-total">0</span>
        </p>

        <div
            class="popup-progress-bar"
            id="category-summary-progress"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
        >
            <div
                class="popup-progress-fill"
                id="category-summary-fill"
            ></div>
        </div>

    </section>


    <div id="category-trophy-list-container">
    </div>


    <button
        type="button"
        class="add-button"
        id="trophy-add-button"
    >
        <span class="add-icon">＋</span>

        <span class="add-text">
            トロフィーを追加
        </span>
    </button>

</main>
<div class="edit-name-modal" id="create-trophy-modal">
    <div class="edit-name-modal-content">
        <h2 class="eit-name-modal-title">
            トロフィーを作成
        </h2>
        <!-- 画像 -->
       <div class="edit-image-preview-wrapper">
            <img
                class="edit-image-preview"
                id="create-trophy-preview"
                src="image/icon/default.webp"
                alt="選択した画像のプレビュー">
        </div>
        <input
            type="file"
            id="create-trophy-image"
            accept="image/*"
            hidden>
        <button
            type="button"
            class="edit-image-select-button"
            id="create-trophy-select-image">
            画像を選択
        </button>
        <!-- 名前 -->
<!-- タイトル -->
<div class="create-trophy-text-field">

    <label
        class="edit-input-label"
        for="create-trophy-name"
    >
        タイトル
    </label>

    <input
        type="text"
        id="create-trophy-name"
        class="edit-name-input"
        maxlength="30"
        placeholder="タイトルを入力"
    >

</div>
<!-- サブテキスト -->
<div class="create-trophy-text-field  create-trophy-subtitle-field">

    <label
        class="edit-input-label"
        for="create-trophy-subtitle"
    >
        サブテキスト
    </label>

    <input
        type="text"
        id="create-trophy-subtitle"
        class="edit-name-input"
        maxlength="30"
        placeholder="サブテキストを入力"
    >

</div>
        <!-- レアリティ -->
    <div class="change-rarity-modal-content">
        <div
            class="change-rarity-list"
            id="create-trophy-rarity-list"
        ></div>
    </div>
        <!-- ボタン -->
        <div class="edit-name-modal-buttons">
            <button
                type="button"
                class="edit-name-cancel-button"
                id="create-trophy-cancel">
                キャンセル
            </button>
            <button
                type="button"
                class="edit-name-confirm-button"
                id="create-trophy-confirm">
                作成
            </button>
        </div>
    </div>
</div>
    <div class="category-overlay" id="trophy-overlay"></div>
    <div class="category-menu" id="trophy-menu">
    <button class="category-menu-item" id="rename-trophy">
        名前変更
    </button>
    <button class="category-menu-item" id="trophy-image">
        画像変更
    </button>
    <button class="category-menu-item" id="change-category">
        カテゴリー変更
    </button>
    <button class="category-menu-item" id="change-rarity">
        レアリティ変更
    </button>
    <button class="category-menu-item" id="toggle-complete">
        クリア済みにする
    </button>
    <button class="category-menu-item" id="change-complete-date">
        クリア日時変更
    </button>
    <button class="category-menu-item delete" id="delete-trophy">
        削除
    </button>
</div>
<div class="edit-name-modal" id="edit-name-modal">
    <div class="edit-name-modal-content">
        <h2 class="edit-name-modal-title" id="edit-name-modal-title">
            名前変更
        </h2>
        <div class="edit-main-title-field">
            <label
                class="edit-input-label"
                id="edit-name-label"
                for="edit-name-input">
                トロフィー名
            </label>
            <input
                type="text"
                class="edit-name-input"
                id="edit-name-input"
                maxlength="30"
                placeholder="トロフィー名を入力">
        </div>
            <div
            class="edit-subtitle-field"
            id="edit-subtitle-field"
            hidden>
            <label
            class="edit-input-label"
            for="edit-subtitle-input">
                サブテキスト
            </label>
            <input
                type="text"
                class="edit-name-input"
                id="edit-subtitle-input"
                maxlength="30"
                placeholder="サブテキストを入力">
            </div>
            <div class="edit-name-modal-buttons">
            <button
                type="button"
                class="edit-name-cancel-button"
                id="edit-name-cancel-button">
                キャンセル
            </button>
            <button
                type="button"
                class="edit-name-confirm-button"
                id="edit-name-confirm-button">
                変更
            </button>
        </div>
    </div>
</div>
<div class="edit-image-modal" id="edit-image-modal">

    <div class="edit-image-modal-content">

        <h2 class="edit-image-modal-title" id="edit-image-modal-title">
            画像変更
        </h2>

        <div class="edit-image-preview-wrapper">

            <img
                class="edit-image-preview"
                id="edit-image-preview"
                src="image/icon/default.webp"
                alt="選択した画像のプレビュー"
            >

        </div>

        <input
            type="file"
            id="edit-image-input"
            accept="image/*"
            hidden
        >

        <button
            type="button"
            class="edit-image-select-button"
            id="edit-image-select-button"
        >
            画像を選択
        </button>

        <div class="edit-image-modal-buttons">

            <button
                type="button"
                class="edit-image-cancel-button"
                id="edit-image-cancel-button"
            >
                キャンセル
            </button>

            <button
                type="button"
                class="edit-image-confirm-button"
                id="edit-image-confirm-button"
            >
                変更
            </button>

        </div>

    </div>

</div>
<div class="change-category-modal" id="change-category-modal">
    <div class="change-category-modal-content">
        <h2
            class="change-category-modal-title"
            id="change-category-modal-title">
            カテゴリー変更
        </h2>
        <div
            class="change-category-list"
            id="change-category-list">
        </div>
        <div class="change-category-modal-buttons">
            <button
                type="button"
                class="change-category-cancel-button"
                id="change-category-cancel-button">
                キャンセル
            </button>
            <button
                type="button"
                class="change-category-confirm-button"
                id="change-category-confirm-button">
                変更
            </button>
        </div>
    </div>
</div>
<div
    class="change-rarity-modal"
    id="change-rarity-modal"
>
    <div class="change-rarity-modal-content">
        <h2 class="change-rarity-modal-title">
            レアリティ変更
        </h2>
        <div
            class="change-rarity-list"
            id="change-rarity-list"
        ></div>
        <div class="change-rarity-modal-buttons">
            <button
                type="button"
                class="change-rarity-cancel-button"
                id="change-rarity-cancel-button"
            >
                キャンセル
            </button>
            <button
                type="button"
                class="change-rarity-confirm-button"
                id="change-rarity-confirm-button"
            >
                変更
            </button>
        </div>
    </div>
</div>
<div class="change-complete-date-modal" id="change-complete-date-modal">
    <div class="change-complete-date-modal-content">
        <h2 class="change-complete-date-modal-title">
            クリア日時を変更
        </h2>
        <input
            type="date"
            class="change-complete-date-input"
            id="change-complete-date-input"
        >
        <div class="change-complete-date-modal-buttons">
            <button
                type="button"
                class="change-complete-date-cancel-button"
                id="change-complete-date-cancel-button"
            >
                キャンセル
            </button>
            <button
                type="button"
                class="change-complete-date-confirm-button"
                id="change-complete-date-confirm-button"
            >
                変更
            </button>
        </div>
    </div>
</div>
<div
    class="delete-trophy-modal"
    id="delete-trophy-modal"
>
    <div class="delete-trophy-modal-content">
        <h2 class="delete-trophy-modal-title">
            トロフィーを削除しますか？
        </h2>
        <p class="delete-trophy-modal-text">
            この操作は取り消せません。
        </p>
        <div class="delete-trophy-modal-buttons">
            <button
                type="button"
                class="delete-trophy-cancel-button"
                id="delete-trophy-cancel-button"
            >
                キャンセル
            </button>
            <button
                type="button"
                class="delete-trophy-confirm-button"
                id="delete-trophy-confirm-button"
            >
                削除
            </button>
        </div>
    </div>
</div>
<div
    class="category-overlay"
    id="category-overlay"
></div>

<div
    class="category-menu"
    id="category-menu"
>
    <button
        type="button"
        class="category-menu-item"
        id="rename-category"
    >
        名前変更
    </button>

    <button
        type="button"
        class="category-menu-item"
        id="category-image"
    >
        画像変更
    </button>

    <button
        type="button"
        class="category-menu-item delete"
        id="delete-category"
    >
        削除
    </button>
</div>
<div
    class="delete-category-modal"
    id="delete-category-modal"
>
    <div class="delete-category-modal-content">
        <h2 class="delete-category-modal-title">
            カテゴリーを削除しますか？
        </h2>
        <p class="delete-category-modal-text">
            この操作は取り消せません。
        </p>
        <div class="delete-category-modal-buttons">
            <button
                type="button"
                class="delete-category-cancel-button"
                id="delete-category-cancel-button"
            >
                キャンセル
            </button>
            <button
                type="button"
                class="delete-category-next-button"
                id="delete-category-next-button"
            >
                確認
            </button>
        </div>
    </div>
</div>
<div
    class="delete-category-final-modal"
    id="delete-category-final-modal"
>
    <div class="delete-category-final-modal-content">
        <h2 class="delete-category-final-modal-title">
            本当に削除しますか？
        </h2>
        <p class="delete-category-final-modal-text">
            中に入っているトロフィーもすべて削除されます。
        </p>
        <div class="delete-category-final-modal-buttons">
            <button
                type="button"
                class="delete-category-final-cancel-button"
                id="delete-category-final-cancel-button"
            >
                戻る
            </button>
            <button
                type="button"
                class="delete-category-final-confirm-button"
                id="delete-category-final-confirm-button"
            >
                削除
            </button>
        </div>
    </div>
</div>
<div
    id="trophy-notification"
    class="trophy-notification"
>
    <img
        id="trophy-notification-image"
        class="trophy-notification-image"
        src=""
        alt=""
    >
    <div class="trophy-notification-info">
        <p class="trophy-notification-label">
            クリア済み ✓
        </p>
        <p
            id="trophy-notification-title"
            class="trophy-notification-title"
        ></p>
        <p
            id="trophy-notification-subtitle"
            class="trophy-notification-subtitle"
        ></p>
    </div>
</div>
</body>
</html>
